<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kanishka | Teddy CSE Portfolio</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: "Trebuchet MS", Arial, sans-serif;
            background: #fff4e6;
            color: #5a3825;
        }

        /* Navigation */

        nav {
            background: #8b5e3c;
            padding: 15px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
        }

        nav h2 {
            color: #fff8ef;
            font-size: 25px;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 18px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        nav ul li a:hover {
            color: #ffd9a8;
        }

        /* Teddy Hero */

        .hero {
            min-height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;

            background: linear-gradient(
                135deg,
                #f8d7b0,
                #fff0d9,
                #e8bd91
            );
        }

        .teddy {
            font-size: 110px;
            margin-bottom: 10px;
            animation: teddyBounce 2s infinite;
        }

        @keyframes teddyBounce {

            0%,100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-12px);
            }
        }

        .hero h1 {
            font-size: 45px;
            color: #70452b;
        }

        .hero h1 span {
            color: #b87543;
        }

        .hero p {
            font-size: 20px;
            margin: 12px 0;
        }

        .cute-text {
            font-size: 16px !important;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 13px 28px;
            background: #8b5e3c;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            box-shadow: 0 5px 10px rgba(0,0,0,0.15);
            transition: 0.3s;
        }

        .btn:hover {
            background: #6f452d;
            transform: scale(1.07);
        }

        /* Sections */

        section {
            max-width: 1000px;
            margin: 45px auto;
            padding: 20px;
        }

        .title {
            text-align: center;
            color: #8b5e3c;
            font-size: 32px;
            margin-bottom: 25px;
        }

        .card {
            background: #fffaf3;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 7px 20px rgba(121, 77, 43, 0.15);
            border: 2px solid #efd0ae;
        }

        .card h3 {
            color: #8b5e3c;
            margin-bottom: 10px;
        }

        /* Teddy decoration */

        .bear-decoration {
            text-align: center;
            font-size: 45px;
            margin-bottom: 15px;
        }

        /* Skills */

        .skills {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 18px;
        }

        .skill {
            background: #e5b889;
            color: #5a3825;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            font-weight: bold;
            transition: 0.3s;
            border: 2px solid #d49d69;
        }

        .skill:hover {
            transform: translateY(-7px);
            background: #d9a36e;
        }

        /* Projects */

        .projects {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .project {
            background: #fffaf3;
            padding: 25px;
            border-radius: 22px;
            box-shadow: 0 7px 18px rgba(121,77,43,0.13);
            border: 2px solid #efd0ae;
            transition: 0.3s;
        }

        .project:hover {
            transform: translateY(-8px);
        }

        .project h3 {
            color: #8b5e3c;
            margin-bottom: 10px;
        }

        /* Education */

        .education {
            text-align: center;
        }

        .education h3 {
            font-size: 24px;
        }

        /* Contact */

        .contact {
            text-align: center;
        }

        .contact a {
            display: inline-block;
            margin: 8px;
            padding: 12px 22px;
            background: #8b5e3c;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            transition: 0.3s;
        }

        .contact a:hover {
            background: #6f452d;
            transform: scale(1.05);
        }

        /* Footer */

        footer {
            background: #70452b;
            color: #fff4e6;
            text-align: center;
            padding: 25px;
            margin-top: 50px;
        }

        footer .bear {
            font-size: 35px;
            margin-bottom: 8px;
        }

        /* Mobile */

        @media (max-width: 650px) {

            nav {
                flex-direction: column;
                gap: 12px;
            }

            nav ul {
                flex-wrap: wrap;
                justify-content: center;
                gap: 10px;
            }

            .hero h1 {
                font-size: 34px;
            }

            .teddy {
                font-size: 85px;
            }

            .hero {
                min-height: 450px;
            }

        }

    </style>
</head>

<body>

    <nav>

        <h2>🧸 Kanishka</h2>

        <ul>

            <li><a href="#about">About</a></li>
            <li><a href="#education">Education</a></li>
            <li><a href="#skills">Skills</a></li>
            <li><a href="#projects">Projects</a></li>
            <li><a href="#contact">Contact</a></li>

        </ul>

    </nav>

    <section class="hero" id="home">

        <div>

            <div class="teddy
